<!DOCTYPE html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="referrer" content="no-referrer">
 <meta name="theme-color" content="#0b1018">
 <title>Ai-shape 演出遙控</title>
 <link rel="stylesheet" href="remote.css">
</head>
<body>
 <main>
  <header>
   <p class="project">Ai-shape</p>
   <h1>演出遙控</h1>
   <p class="remote-help">另一台裝置按「開始」後，這裡就能直接操控，不必先配對。畫面與聲音只在播放裝置輸出。</p>
   <p id="remoteStatus" role="status">正在連線…</p>
  </header>
  <section class="cue" aria-label="目前步驟" aria-live="polite">
   <p id="remoteStep">等待投影端</p>
   <p id="remoteCue">—</p>
   <p id="remoteVoiceStatus" class="voice-status" role="status" hidden></p>
  </section>
  <nav class="navigation" aria-label="切換演出步驟">
   <button type="button" data-action="previous" disabled>← 上一步</button>
   <button type="button" data-action="next" disabled>下一步 →</button>
   <button type="button" id="openStepList" aria-haspopup="dialog" aria-controls="stepDialog" disabled>☷ 步驟清單</button>
  </nav>
  <section class="next-prompt" id="nextScenePrompt" aria-labelledby="nextPromptHeading" hidden>
   <h2 id="nextPromptHeading">步驟前後預覽</h2>
   <p id="nextPromptStep" class="prompt-step">前兩步 · 目前步驟 · 後兩步</p>
   <ol id="stepContextList" class="step-context-list" aria-label="目前步驟及前後各兩步"></ol>
  </section>
  <section class="mixer" aria-labelledby="mixerHeading">
   <h2 id="mixerHeading">投影音量控制</h2>
   <p class="mixer-note">拉桿是設定音量；下方電平表是播放裝置正在輸出的實際聲音強度。</p>
   <div class="channel">
    <div class="channel-heading"><label for="sliderVoice">語音</label><output id="remoteVoice">—</output></div>
    <input type="range" id="sliderVoice" data-channel="voice" min="0" max="100" step="1" value="100" disabled>
    <div class="level-row"><meter id="meterVoice" min="-60" max="0" value="-60" aria-label="語音即時音訊電平"></meter><output id="levelVoice">靜音</output></div>
   </div>
   <div class="channel">
    <div class="channel-heading"><label for="sliderEffect">音效</label><output id="remoteEffect">—</output></div>
    <input type="range" id="sliderEffect" data-channel="effect" min="0" max="100" step="1" value="100" disabled>
    <div class="level-row"><meter id="meterEffect" min="-60" max="0" value="-60" aria-label="音效即時音訊電平"></meter><output id="levelEffect">靜音</output></div>
   </div>
   <div class="channel">
    <div class="channel-heading"><label for="sliderMusic">背景音樂</label><output id="remoteMusic">—</output></div>
    <input type="range" id="sliderMusic" data-channel="music" min="0" max="100" step="1" value="100" disabled>
    <div class="level-row"><meter id="meterMusic" min="-60" max="0" value="-60" aria-label="背景音樂即時音訊電平"></meter><output id="levelMusic">靜音</output></div>
   </div>
   <button type="button" data-action="toggleVolumeDisplay" aria-pressed="false" disabled>在投影上顯示音量</button>
  </section></main>
 <dialog id="stepDialog" aria-labelledby="stepDialogHeading">
  <div class="step-dialog-content">
   <header class="step-dialog-header">
    <div><h2 id="stepDialogHeading">演出步驟清單</h2>
     <p id="stepDialogInfo" aria-live="polite">正在讀取步驟…</p></div>
    <button type="button" id="closeStepList" aria-label="關閉步驟清單">✕</button>
   </header>
   <label for="stepSearch">搜尋步驟編號、台詞或場景</label>
   <input id="stepSearch" type="search" placeholder="輸入步驟、角色或台詞…" autocomplete="off">
   <p class="step-dialog-hint">點選步驟立即跳轉，略過的媒體不會播放。若跳到一段錄音的中間，該段錄音會從開頭播放。</p>
   <ol id="remoteStepList" aria-label="可跳轉的演出步驟"></ol>
  </div>
 </dialog>
 <script src="script-data.js"></script>
 <script src="end-credits.js"></script>
 <script src="subtitle-data.js"></script>
 <script src="remote-link.js"></script>
 <script src="remote-control.js"></script>
</body>
</html>
