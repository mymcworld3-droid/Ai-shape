name: Retouch memory room background
on:
  push:
    branches: [remove-memory-room-decor-20261111]
permissions:
  contents: write
jobs:
  retouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install pillow numpy opencv-python-headless
      - name: Remove only pedestal and frame
        run: python tools/retouch-memory-room.py
      - name: Commit surgically corrected artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/backgrounds/memory-room.png
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove pedestal and picture frame from memory room'
            git push
          fi
