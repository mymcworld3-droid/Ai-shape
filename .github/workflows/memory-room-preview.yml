name: Memory room visual diagnostic
on:
  push:
    branches: [remove-memory-room-decor-20261111]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Print a compact encoded preview for layout inspection
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          import io,base64
          im=Image.open('assets/backgrounds/memory-room.png').convert('RGB')
          print('ROOM_DIMS',im.size)
          im.thumbnail((640,360))
          b=io.BytesIO();im.save(b,format='JPEG',quality=48,optimize=True)
          print('ROOM_IMAGE_BEGIN')
          data=base64.b64encode(b.getvalue()).decode()
          for i in range(0,len(data),400):
              print(data[i:i+400])
          print('ROOM_IMAGE_END')
          PY
