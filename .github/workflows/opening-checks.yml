name: Opening checks
on: [push, pull_request]
jobs:
  opening-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check opening-controller.js
      - run: node --check opening-config.js
      - run: node --check visualizer.js
      - run: node --test tests/opening.test.cjs
  opening-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: google-chrome --version
      - run: npx playwright install-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-browser-evidence
          path: test-results/
