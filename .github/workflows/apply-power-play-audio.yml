name: Apply Power Play music assets
on:
  push:
    branches: [music-refresh-20261111]
    paths:
      - '.github/audio-staging/**'
      - '.github/workflows/apply-power-play-audio.yml'
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract the user-provided music files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/audio-staging/part-*.bin > /tmp/power-play-assets.zip
          echo '9c136bd2f835ba5838af09e0ce7b19439c40976d669be49eecd701cc8bb4c780  /tmp/power-play-assets.zip' | sha256sum -c -
          unzip -t /tmp/power-play-assets.zip
          unzip -o /tmp/power-play-assets.zip 'assets/audio/*' -d .
          for f in \
            'assets/audio/background/act-1/1-92.mp3' \
            'assets/audio/background/act-1/92-93(轉場).mp3' \
            'assets/audio/background/act-1/94-174.mp3' \
            'assets/audio/background/act-1/174-175(轉場).mp3' \
            'assets/audio/background/act-3/after-chris-transition.mp3' \
            'assets/audio/background/act-4/Ending.m4a'
          do test -s "$f"; done
      - name: Commit unpacked audio to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/audio-staging
          git add assets/audio/background
          git commit -m 'Add six original Power Play audio files and remove transfer chunks'
          git push origin HEAD:music-refresh-20261111
