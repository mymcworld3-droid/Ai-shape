<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音助理風格視覺化</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #controls {
            margin-top: 20px;
            z-index: 10;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="controls">
        <input type="file" id="audioUpload" accept=".mp3, .wav, .ogg, audio/*">
        <audio id="audioElement" controls></audio>
    </div>
    <canvas id="visualizer"></canvas>

    <script>
        const audioUpload = document.getElementById('audioUpload');
        const audioElement = document.getElementById('audioElement');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        let audioCtx;
        let analyser;
        let source;
        let dataArray;
        let smoothedDataArray;
        let dpr = window.devicePixelRatio || 1;
        
        let currentHexAngle = 0;
        let targetHexAngle = 0;
        let lastRotateTime = 0; 

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        audioUpload.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            audioElement.src = url;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audioElement);
                
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                smoothedDataArray = new Float32Array(bufferLength);
            }

            audioElement.play();
            draw();
        });

        function drawCenterHexagon(x, y, baseRadius, pulse, angleOffset) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angleOffset);

            // 根據音量變化 (pulse) 計算亮度 (alpha 值介於 0.2 到 1 之間)
            const brightness = Math.min(1, 0.2 + (pulse / (40 * dpr)));

            // 發光範圍也隨音量放大
            ctx.shadowBlur = (15 + pulse * 0.5) * dpr;
            ctx.shadowColor = `rgba(255, 255, 255, ${brightness})`;

            // 繪製實心六邊形
            ctx.beginPath();
            // 大小隨音量 (pulse) 進行動態縮放
            const hexRadius = baseRadius * 0.6 + pulse * 0.8;
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const pX = hexRadius * Math.cos(angle);
                const pY = hexRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(pX, pY);
                else ctx.lineTo(pX, pY);
            }
            ctx.closePath();
            
            ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
            ctx.fill();

            ctx.restore();
        }

        function drawWaveLayer(centerX, centerY, baseRadius, totalPoints, halfPoints, ampMultiplier, alpha, lineWidth, blur) {
            let points = [];

            for (let i = 0; i <= halfPoints; i++) {
                const dataIndex = Math.floor((i / halfPoints) * (smoothedDataArray.length * 0.4)); 
                const barValue = smoothedDataArray[dataIndex];
                
                const ripple = (barValue / 255) * 40 * dpr * ampMultiplier; 
                const r = baseRadius + ripple;
                const angle = (Math.PI * 2 / totalPoints) * i - Math.PI / 2;

                points.push({
                    x: centerX + r * Math.cos(angle),
                    y: centerY + r * Math.sin(angle)
                });
            }

            for (let i = halfPoints - 1; i > 0; i--) {
                const dataIndex = Math.floor((i / halfPoints) * (smoothedDataArray.length * 0.4)); 
                const barValue = smoothedDataArray[dataIndex];
                
                const ripple = (barValue / 255) * 40 * dpr * ampMultiplier;
                const r = baseRadius + ripple;
                const angle = (Math.PI * 2 / totalPoints) * (totalPoints - i) - Math.PI / 2;

                points.push({
                    x: centerX + r * Math.cos(angle),
                    y: centerY + r * Math.sin(angle)
                });
            }

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            for (let i = 1; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) / 2;
                const yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }

            ctx.quadraticCurveTo(
                points[points.length - 1].x, 
                points[points.length - 1].y, 
                points[0].x, 
                points[0].y
            );

            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = lineWidth * dpr;
            ctx.shadowBlur = blur * dpr;
            ctx.shadowColor = `rgba(255, 255, 255, ${alpha + 0.2 > 1 ? 1 : alpha + 0.2})`;
            ctx.stroke();
            
            ctx.shadowBlur = 0;
        }

        function draw() {
            requestAnimationFrame(draw);

            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                smoothedDataArray[i] += (dataArray[i] - smoothedDataArray[i]) * 0.08;
                sum += smoothedDataArray[i];
            }

            ctx.fillStyle = 'rgba(5, 5, 5, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const avgVolume = sum / dataArray.length;
            const globalPulse = (avgVolume / 255) * 50 * dpr;

            const now = Date.now();
            
            if (avgVolume > 10 && now - lastRotateTime > 2000) {
                targetHexAngle += Math.PI / 3; 
                lastRotateTime = now;
            }
            
            currentHexAngle += (targetHexAngle - currentHexAngle) * 0.06;

            const centerBaseRadius = 100 * dpr;
            drawCenterHexagon(centerX, centerY, centerBaseRadius, globalPulse, currentHexAngle);

            const totalPoints = 120; 
            const halfPoints = totalPoints / 2;
            const waveBaseRadius = centerBaseRadius + 45 * dpr + globalPulse; 

            drawWaveLayer(centerX, centerY, waveBaseRadius, totalPoints, halfPoints, 1.5, 0.15, 6, 30);
            drawWaveLayer(centerX, centerY, waveBaseRadius, totalPoints, halfPoints, 1.0, 0.4, 4, 15);
            drawWaveLayer(centerX, centerY, waveBaseRadius, totalPoints, halfPoints, 0.6, 0.8, 2, 5);
        }
    </script>
</body>
</html>
