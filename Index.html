<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shape Room Visualizer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{position:relative}

/* Keep the whole room image in its original 3:2 ratio so the canvas always stays on the TV. */
#stageFrame{position:fixed;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}
#stage{
  position:relative;
  width:min(100vw,150vh);
  aspect-ratio:3/2;
  background:url("IMG_0165.png") center/100% 100% no-repeat;
  overflow:hidden;
}

/* Room darkening layer. It sits above the background but below the TV visualizer. */
#dimOverlay{
  position:absolute;inset:0;z-index:2;
  background:rgba(0,7,18,.72);
  opacity:0;
  transition:opacity 1.15s ease;
  pointer-events:none;
}
body.playing #dimOverlay{opacity:.60}

/* Exact inner black-screen area of IMG_0165.png. */
#visualizerWrap{
  position:absolute;
  z-index:3;
  left:35.78%;
  top:30.28%;
  width:28.38%;
  height:19.24%;
  overflow:hidden;
  background:#050505;
}
#visualizer{position:absolute;inset:0;width:100%;height:100%;display:block;background:#050505}

/* Controls float over the room and fade during playback. */
#controls{
  position:fixed;z-index:10;left:50%;bottom:14px;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  padding:8px 10px;border:1px solid rgba(255,255,255,.16);border-radius:12px;
  background:rgba(3,7,13,.76);backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.32);
  transition:opacity .45s ease;
}
body.playing #controls{opacity:.14}
body.playing #controls:hover{opacity:1}
#audioUpload{max-width:200px;color:#fff;font-size:11px}
#audioUpload::file-selector-button{margin-right:6px;padding:6px 9px;border:0;border-radius:7px;background:#fff;color:#000;cursor:pointer;font-weight:700}
#audioElement{width:230px;height:30px}
#freqControls{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,.72);white-space:nowrap}
#freqControls label{display:flex;align-items:center;gap:4px}
#freqControls input[type=range]{width:85px;accent-color:#fff}
#freqMinValue,#freqMaxValue{display:inline-block;min-width:45px;text-align:right;color:#fff;font-variant-numeric:tabular-nums}
#status{
  position:fixed;z-index:10;right:12px;top:10px;padding:6px 9px;border-radius:8px;
  background:rgba(0,0,0,.42);color:rgba(255,255,255,.68);font-size:9px;letter-spacing:1.6px;
  pointer-events:none;transition:opacity .4s ease;
}
body.playing #status{opacity:.35}
@media(max-width:760px){
  #controls{bottom:8px;width:calc(100% - 16px);gap:5px;padding:6px 8px}
  #audioUpload,#audioElement{width:100%;max-width:none}
  #freqControls{width:100%;justify-content:center;flex-wrap:wrap}
  #freqControls input[type=range]{width:100px}
}
</style>
</head>
<body>
<div id="stageFrame">
  <div id="stage">
    <div id="dimOverlay"></div>
    <div id="visualizerWrap"><canvas id="visualizer"></canvas></div>
  </div>
</div>

<div id="controls">
  <input type="file" id="audioUpload" accept=".mp3,.wav,.ogg,audio/*">
  <audio id="audioElement" controls></audio>
  <div id="freqControls" aria-label="音頻顯示範圍">
    <span>頻率範圍</span>
    <label>低 <input id="freqMin" type="range" min="20" max="20000" step="10" value="20"><span id="freqMinValue">20 Hz</span></label>
    <label>高 <input id="freqMax" type="range" min="20" max="20000" step="10" value="20000"><span id="freqMaxValue">20 kHz</span></label>
  </div>
</div>
<div id="status">WAITING FOR AUDIO</div>

<script>
"use strict";
const audioUpload=document.getElementById("audioUpload");
const audioElement=document.getElementById("audioElement");
const canvas=document.getElementById("visualizer");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const freqMinInput=document.getElementById("freqMin");
const freqMaxInput=document.getElementById("freqMax");
const freqMinValue=document.getElementById("freqMinValue");
const freqMaxValue=document.getElementById("freqMaxValue");

let audioCtx=null,analyser=null,source=null,dataArray=null;
let smooth=new Float32Array(512);
let dpr=1,w=0,h=0,cx=0,cy=0,scale=1;
let energy=0,bassEnergy=0,midEnergy=0,highEnergy=0,pulse=0,rotation=0,lastTime=0;
let rotationTarget=0,rotationMoving=false,rotationMoveStart=0,rotationStart=0;
const ROTATE_INTERVAL=500;
const ROTATE_DURATION=1400;
const ROTATE_STEP=Math.PI/3;
const particles=[];
const PARTICLES=62;
let freqMin=20,freqMax=20000;

/* Small before playback, large while audio is running, small again after it ends. */
let visualZoom=.58;
let visualZoomTarget=.58;

function formatFreq(v){return v>=1000?(v/1000).toFixed(v%1000===0?0:1)+" kHz":Math.round(v)+" Hz"}
function updateFreqLabels(){freqMinValue.textContent=formatFreq(freqMin);freqMaxValue.textContent=formatFreq(freqMax)}
function clampFreqRange(){
  freqMin=Math.max(20,Math.min(20000,Number(freqMinInput.value)));
  freqMax=Math.max(20,Math.min(20000,Number(freqMaxInput.value)));
  if(freqMin>=freqMax){
    if(document.activeElement===freqMinInput)freqMax=Math.min(20000,freqMin+10);
    else freqMin=Math.max(20,freqMax-10);
    freqMinInput.value=freqMin;freqMaxInput.value=freqMax;
  }
  updateFreqLabels();
}
freqMinInput.addEventListener("input",clampFreqRange);
freqMaxInput.addEventListener("input",clampFreqRange);
updateFreqLabels();

function resizeCanvas(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  w=canvas.clientWidth;h=canvas.clientHeight;
  canvas.width=Math.max(1,Math.floor(w*dpr));
  canvas.height=Math.max(1,Math.floor(h*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=w/2;cy=h/2;
  scale=Math.max(.30,Math.min(Math.min(w,h)/320,1));
  initParticles();
}
window.addEventListener("resize",resizeCanvas);
function initParticles(){
  particles.length=0;
  const maxR=Math.min(w,h)*.47;
  for(let i=0;i<PARTICLES;i++)particles.push({a:Math.random()*Math.PI*2,r:maxR*(.45+Math.random()*.5),s:.00012+Math.random()*.00065,size:.4+Math.random()*1.2,alpha:.03+Math.random()*.16});
}
requestAnimationFrame(()=>{resizeCanvas();requestAnimationFrame(draw)});

function freqToBin(freq){
  if(!analyser||!audioCtx)return 0;
  const nyquist=audioCtx.sampleRate/2;
  return Math.max(0,Math.min(analyser.frequencyBinCount-1,Math.round(freq/nyquist*analyser.frequencyBinCount)));
}
function selectedBins(){
  if(!analyser)return{lo:0,hi:Math.min(1,smooth.length-1)};
  const lo=freqToBin(freqMin),hi=Math.max(lo+1,freqToBin(freqMax));
  return{lo,hi:Math.min(analyser.frequencyBinCount-1,hi)};
}

let objectURL=null;
audioUpload.addEventListener("change",async function(){
  const file=this.files[0];if(!file)return;
  document.body.classList.remove("playing");
  visualZoomTarget=.58;
  status.textContent="READY";
  if(objectURL)URL.revokeObjectURL(objectURL);
  objectURL=URL.createObjectURL(file);
  audioElement.src=objectURL;
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=1024;
    analyser.minDecibels=-90;
    analyser.maxDecibels=-10;
    analyser.smoothingTimeConstant=.22;
    source=audioCtx.createMediaElementSource(audioElement);
    source.connect(analyser);analyser.connect(audioCtx.destination);
    dataArray=new Uint8Array(analyser.frequencyBinCount);
    smooth=new Float32Array(analyser.frequencyBinCount);
  }
  if(audioCtx.state==="suspended")await audioCtx.resume();
  try{await audioElement.play()}catch(e){}
});

audioElement.addEventListener("play",async()=>{
  if(audioCtx&&audioCtx.state==="suspended")await audioCtx.resume();
  document.body.classList.add("playing");
  visualZoomTarget=1.08;
  status.textContent="LISTENING";
});
audioElement.addEventListener("pause",()=>{
  if(!audioElement.ended)status.textContent="PAUSED";
});
audioElement.addEventListener("ended",()=>{
  document.body.classList.remove("playing");
  visualZoomTarget=.58;
  status.textContent="AUDIO COMPLETE";
});

function analyze(){
  if(!analyser||!dataArray)return{avg:0,low:0,mid:0,high:0};
  analyser.getByteFrequencyData(dataArray);
  let sum=0,low=0,mid=0,high=0;
  const range=selectedBins(),lo=range.lo,hi=range.hi;
  const span=Math.max(1,hi-lo);
  for(let i=0;i<dataArray.length;i++){
    const raw=dataArray[i];
    const k=raw>smooth[i]?.42:.12;
    smooth[i]+=(raw-smooth[i])*k;
    if(i<lo||i>hi)continue;
    const v=smooth[i];sum+=v;
    const p=(i-lo)/span;
    if(p<.30)low+=v;else if(p<.65)mid+=v;else high+=v;
  }
  const count=Math.max(1,hi-lo+1);
  return{avg:sum/count,low:low/Math.max(1,span*.30),mid:mid/Math.max(1,span*.35),high:high/Math.max(1,span*.35)};
}

function radialPoint(r,a){return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}}
function drawSymmetricRing(r,thickness,alpha,glow){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=thickness;
  ctx.shadowBlur=glow;ctx.shadowColor=`rgba(255,255,255,${Math.min(.9,alpha+.16)})`;ctx.stroke();ctx.restore();
}

function drawCoil(base,amp,alpha,line,blur,phase,bandStart,bandEnd){
  const points=240,arr=[];
  const range=selectedBins(),lo=range.lo,hi=range.hi;
  for(let i=0;i<points;i++){
    const t=i/points,u=t<.5?t*2:(1-t)*2;
    const idx=Math.min(hi,Math.max(lo,Math.floor(lo+(hi-lo)*(bandStart+(bandEnd-bandStart)*u))));
    const idx2=Math.min(hi,Math.max(lo,Math.floor(lo+(hi-lo)*(bandStart+(bandEnd-bandStart)*Math.min(1,u+.018)))));
    const v=Math.max(0,Math.min(1,(smooth[idx]||0)/255));
    const v2=Math.max(0,Math.min(1,(smooth[idx2]||0)/255));
    const harmonic=v*v*.72+v2*v2*.28;
    const detail=.88+.12*Math.sin(u*Math.PI*22+phase);
    const ripple=harmonic*amp*scale*4.2*detail;
    const fine=(highEnergy/255)**2*2.4*scale*Math.sin(u*Math.PI*54+phase*2.1);
    const bassBend=(bassEnergy/255)**2*amp*.12*scale*Math.sin(u*Math.PI*6+phase*.55);
    const a=t*Math.PI*2-Math.PI/2;
    arr.push(radialPoint(base+ripple+fine+bassBend,a));
  }
  ctx.save();ctx.beginPath();ctx.moveTo(arr[0].x,arr[0].y);
  for(let i=0;i<points;i++){const p=arr[i],q=arr[(i+1)%points];ctx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2)}
  ctx.closePath();ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=line;
  ctx.shadowBlur=blur;ctx.shadowColor=`rgba(255,255,255,${Math.min(1,alpha+.22)})`;ctx.stroke();ctx.restore();
}
function drawCoilGlow(base,phase){
  drawCoil(base,34,.04,5,20,phase,.00,.72);
  drawCoil(base+1*scale,30,.07,3.5,15,phase*1.08+.8,.04,.78);
  drawCoil(base-1*scale,26,.17,2.2,10,phase*1.22+1.5,.08,.84);
  drawCoil(base-3*scale,22,.72,1.25,6,phase*1.45+2.7,.02,.90);
}

function drawBassArcs(radius,audio,phase){
  const bass=Math.pow(Math.min(1,audio.low/255),2);
  ctx.save();ctx.lineCap="round";
  for(let j=0;j<3;j++){
    ctx.beginPath();
    const arcRadius=radius+(j-1)*4*scale+bass*10*scale;
    const start=phase*.55+j*Math.PI*2/3;
    const span=.55+bass*.9;
    ctx.arc(cx,cy,arcRadius,start,start+span);
    ctx.strokeStyle=`rgba(255,255,255,${.07+bass*.15-j*.015})`;
    ctx.lineWidth=(1+j*.45)*scale;ctx.shadowBlur=(4+bass*10)*scale;ctx.shadowColor="rgba(255,255,255,.55)";ctx.stroke();
  }
  ctx.restore();
}

function updateHexRotation(now){
  if(!rotationMoving&&now-rotationMoveStart>=ROTATE_INTERVAL){rotationMoving=true;rotationStart=rotation;rotationTarget=rotation+ROTATE_STEP;rotationMoveStart=now}
  if(rotationMoving){
    const p=Math.max(0,Math.min(1,(now-rotationMoveStart)/ROTATE_DURATION));
    const eased=1-Math.pow(1-p,5);
    rotation=rotationStart+(rotationTarget-rotationStart)*eased;
    if(p>=1){rotation=rotationTarget;rotationMoving=false;rotationMoveStart=now}
  }
}

function drawHex(radius,rot,audio){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  const def=[];const range=selectedBins(),lo=range.lo,hi=range.hi;
  for(let i=0;i<6;i++){
    const band=Math.floor(lo+(i/6)*Math.max(1,(hi-lo)*.30));
    const v=Math.max(0,Math.min(1,(smooth[Math.min(hi,band)]||0)/255));
    def[i]=(v*v)*7*scale*(.7+(audio.low/255)**2*.8);
  }
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,r=radius+def[i],x=r*Math.cos(a),y=r*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
  ctx.closePath();
  const bright=Math.min(1,.28+energy*.72);
  ctx.shadowBlur=(12+energy*18)*scale;ctx.shadowColor=`rgba(255,255,255,${bright})`;ctx.fillStyle=`rgba(255,255,255,${bright})`;ctx.fill();ctx.shadowBlur=0;
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,r=radius*.73+def[i]*.4,x=r*Math.cos(a),y=r*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
  ctx.closePath();ctx.fillStyle="rgba(5,5,5,.94)";ctx.fill();
  const edgeWidth=(1.1+Math.min(1,energy)*14)*scale;
  ctx.strokeStyle=`rgba(255,255,255,${.22+energy*.48})`;ctx.lineWidth=edgeWidth;ctx.stroke();
  const core=(2.2+energy*4+audio.high/255*1.5)*scale;
  ctx.beginPath();ctx.arc(0,0,core,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${.4+energy*.6})`;ctx.shadowBlur=8*scale;ctx.shadowColor="rgba(255,255,255,.8)";ctx.fill();
  ctx.restore();
}

function drawOuterHex(radius,rot,audio){
  const outerScale=1.52+Math.pow(Math.min(1,energy),2)*.24;
  const outerRadius=radius*outerScale;
  const outerDef=(audio.low/255)**2*5*scale;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,r=outerRadius+outerDef,x=r*Math.cos(a),y=r*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
  ctx.closePath();ctx.strokeStyle=`rgba(255,255,255,${.15+energy*.28})`;ctx.lineWidth=(1+energy*2.2)*scale;
  ctx.shadowBlur=(5+energy*8)*scale;ctx.shadowColor="rgba(255,255,255,.65)";ctx.stroke();ctx.restore();
}

function drawParticles(audio){
  for(const p of particles){
    p.a+=p.s*16;
    const r=p.r*visualZoom+energy*18*scale+audio.high/255*8*scale;
    const x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r;
    ctx.beginPath();ctx.arc(x,y,p.size+(audio.high/255)*.4,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${Math.min(.42,p.alpha*(.25+energy*1.8))})`;ctx.fill();
  }
}

function draw(){
  requestAnimationFrame(draw);
  const now=performance.now(),dt=Math.min(40,now-lastTime||16);lastTime=now;
  const a=analyze(),target=Math.min(1,a.avg/68);
  energy+=(target-energy)*.15;
  bassEnergy+=(a.low-bassEnergy)*.20;
  midEnergy+=(a.mid-midEnergy)*.16;
  highEnergy+=(a.high-highEnergy)*.25;
  const beat=Math.max(0,target-energy);
  pulse+=(beat*30+energy*8+(bassEnergy/255)**2*5-pulse)*.22;
  visualZoom+=(visualZoomTarget-visualZoom)*.055;
  updateHexRotation(now);

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#050505";ctx.fillRect(0,0,w,h);

  const m=Math.min(w,h);
  const hexR=m*.105*visualZoom+energy*5*scale;
  const waveBase=(m*.20*visualZoom)+pulse*scale;
  const ringR=m*.285*visualZoom;

  drawParticles(a);
  drawSymmetricRing(ringR,1+energy*1.2,.08+energy*.14,energy*7*scale);
  drawSymmetricRing(ringR+6*scale,1,.025+energy*.06,energy*4*scale);
  drawBassArcs(ringR+2*scale,a,now*.00065);
  drawCoilGlow(waveBase,now*.00045);
  drawOuterHex(hexR,rotation,a);
  drawHex(hexR,rotation,a);
}
</script>
</body>
</html>
