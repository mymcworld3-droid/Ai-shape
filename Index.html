<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Voice Assistant Visualizer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #151515 0%,
                    #080808 35%,
                    #020202 100%
                );

            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body {
            position: relative;
        }

        /* =================================
           Canvas
        ================================= */

        #visualizer {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: 1;

            display: block;
        }


        /* =================================
           Controls
        ================================= */

        #controls {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 10px 14px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 12px;

            background:
                rgba(15,15,15,0.72);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.45);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        #audioUpload {
            max-width: 210px;

            color: white;

            font-size: 13px;
        }

        #audioUpload::file-selector-button {
            margin-right: 8px;

            padding:
                7px 11px;

            border: none;

            border-radius: 7px;

            background: #ffffff;

            color: #000000;

            cursor: pointer;

            font-weight: 600;
        }

        #audioElement {
            width: 260px;

            height: 34px;
        }


        /* =================================
           Status
        ================================= */

        #status {
            position: fixed;

            left: 50%;
            bottom: 28px;

            transform:
                translateX(-50%);

            z-index: 10;

            padding:
                7px 14px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 999px;

            background:
                rgba(0,0,0,0.35);

            color:
                rgba(255,255,255,0.55);

            font-size: 11px;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

            pointer-events: none;
        }


        /* =================================
           Mobile
        ================================= */

        @media (max-width: 700px) {

            #controls {
                width: calc(100% - 24px);

                flex-direction: column;

                gap: 8px;
            }

            #audioUpload {
                width: 100%;
            }

            #audioElement {
                width: 100%;
            }
        }
    </style>
</head>


<body>

    <!-- =================================
         Controls
    ================================= -->

    <div id="controls">

        <input
            type="file"
            id="audioUpload"
            accept=".mp3,.wav,.ogg,audio/*"
        >

        <audio
            id="audioElement"
            controls
        ></audio>

    </div>


    <!-- =================================
         Visualizer
    ================================= -->

    <canvas id="visualizer"></canvas>


    <div id="status">
        WAITING FOR AUDIO
    </div>


<script>

"use strict";


// ============================================================
// DOM
// ============================================================

const audioUpload =
    document.getElementById("audioUpload");

const audioElement =
    document.getElementById("audioElement");

const canvas =
    document.getElementById("visualizer");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");


// ============================================================
// AUDIO VARIABLES
// ============================================================

let audioCtx = null;

let analyser = null;

let source = null;

let dataArray = null;

let smoothedDataArray = null;

let animationStarted = false;

let currentObjectURL = null;


// ============================================================
// DISPLAY
// ============================================================

let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );


// ============================================================
// HEXAGON STATE
// ============================================================

let currentHexAngle = 0;

let targetHexAngle = 0;

let lastRotateTime = 0;


// ============================================================
// ENERGY STATE
// ============================================================

let currentPulse = 0;

let targetPulse = 0;

let currentEnergy = 0;

let previousEnergy = 0;


// ============================================================
// RESIZE
// ============================================================

function resizeCanvas() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(
            window.innerWidth * dpr
        );

    canvas.height =
        Math.floor(
            window.innerHeight * dpr
        );

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


// ============================================================
// AUDIO UPLOAD
// ============================================================

audioUpload.addEventListener(
    "change",
    async function (event) {

        const file =
            event.target.files[0];

        if (!file)
            return;


        // --------------------------------------------
        // Release previous object URL
        // --------------------------------------------

        if (currentObjectURL) {

            URL.revokeObjectURL(
                currentObjectURL
            );
        }


        currentObjectURL =
            URL.createObjectURL(file);


        audioElement.src =
            currentObjectURL;


        // --------------------------------------------
        // Create AudioContext
        // --------------------------------------------

        if (!audioCtx) {

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            analyser =
                audioCtx.createAnalyser();


            source =
                audioCtx.createMediaElementSource(
                    audioElement
                );


            source.connect(
                analyser
            );


            analyser.connect(
                audioCtx.destination
            );


            // ========================================
            // FFT
            // ========================================

            analyser.fftSize = 512;


            // ========================================
            // Smoothing
            // ========================================

            analyser.smoothingTimeConstant =
                0.45;


            const bufferLength =
                analyser.frequencyBinCount;


            dataArray =
                new Uint8Array(
                    bufferLength
                );


            smoothedDataArray =
                new Float32Array(
                    bufferLength
                );
        }


        // --------------------------------------------
        // Resume AudioContext
        // --------------------------------------------

        if (
            audioCtx.state ===
            "suspended"
        ) {

            await audioCtx.resume();
        }


        // --------------------------------------------
        // Play
        // --------------------------------------------

        try {

            await audioElement.play();

        } catch (error) {

            console.log(
                "Audio play waiting for user interaction."
            );
        }


        status.textContent =
            "AUDIO ANALYZING";


        // --------------------------------------------
        // Start visualizer
        // --------------------------------------------

        if (!animationStarted) {

            animationStarted = true;

            requestAnimationFrame(
                draw
            );
        }
    }
);


// ============================================================
// AUDIO ANALYSIS
// ============================================================

function analyzeAudio() {

    if (!analyser)
        return {
            average: 0,
            low: 0,
            mid: 0,
            high: 0
        };


    analyser.getByteFrequencyData(
        dataArray
    );


    let sum = 0;


    // ========================================================
    // SMOOTH FREQUENCY DATA
    // ========================================================

    for (
        let i = 0;
        i < dataArray.length;
        i++
    ) {

        const raw =
            dataArray[i];


        /*
            上升速度快
            下降速度稍慢

            讓聲音出現時更加敏感
        */

        const attack =
            raw >
            smoothedDataArray[i]
                ? 0.28
                : 0.075;


        smoothedDataArray[i] +=
            (
                raw -
                smoothedDataArray[i]
            ) * attack;


        sum +=
            smoothedDataArray[i];
    }


    const average =
        sum /
        dataArray.length;


    // ========================================================
    // FREQUENCY BANDS
    // ========================================================

    const length =
        dataArray.length;


    let low = 0;

    let mid = 0;

    let high = 0;


    for (
        let i = 0;
        i < length;
        i++
    ) {

        const value =
            smoothedDataArray[i];


        if (
            i <
            length * 0.10
        ) {

            low += value;

        } else if (
            i <
            length * 0.42
        ) {

            mid += value;

        } else {

            high += value;
        }
    }


    low /=
        length * 0.10;

    mid /=
        length * 0.32;

    high /=
        length * 0.58;


    return {
        average,
        low,
        mid,
        high
    };
}


// ============================================================
// DRAW HEXAGON PATH
// ============================================================

function createHexagonPath(
    radius
) {

    ctx.beginPath();


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const angle =
            Math.PI / 3 * i -
            Math.PI / 2;


        const x =
            radius *
            Math.cos(angle);


        const y =
            radius *
            Math.sin(angle);


        if (i === 0) {

            ctx.moveTo(
                x,
                y
            );

        } else {

            ctx.lineTo(
                x,
                y
            );
        }
    }


    ctx.closePath();
}


// ============================================================
// CENTER HEXAGON
// ============================================================

function drawCenterHexagon(
    x,
    y,
    baseRadius,
    pulse,
    rotation,
    energy,
    highEnergy
) {

    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        rotation
    );


    // ========================================================
    // RADIUS
    // ========================================================

    const radius =
        baseRadius * 0.88 +
        pulse * 1.25;


    // ========================================================
    // BRIGHTNESS
    // ========================================================

    const brightness =
        Math.min(
            1,
            0.22 +
            energy * 0.8
        );


    // ========================================================
    // OUTER GLOW
    // ========================================================

    ctx.shadowBlur =
        (
            28 +
            pulse * 0.9 +
            highEnergy * 0.15
        ) * dpr;


    ctx.shadowColor =
        `rgba(
            255,
            255,
            255,
            ${brightness}
        )`;


    // ========================================================
    // MAIN HEXAGON
    // ========================================================

    createHexagonPath(
        radius
    );


    ctx.fillStyle =
        `rgba(
            255,
            255,
            255,
            ${brightness}
        )`;


    ctx.fill();


    ctx.shadowBlur = 0;


    // ========================================================
    // INNER CORE
    // ========================================================

    const innerRadius =
        radius *
        (
            0.79 +
            energy * 0.035
        );


    createHexagonPath(
        innerRadius
    );


    ctx.fillStyle =
        "rgba(5,5,5,0.82)";


    ctx.fill();


    // ========================================================
    // INNER GLOW
    // ========================================================

    ctx.shadowBlur =
        (
            12 +
            energy * 18
        ) * dpr;


    ctx.shadowColor =
        `rgba(
            255,
            255,
            255,
            ${0.3 + energy * 0.6}
        )`;


    createHexagonPath(
        innerRadius * 0.92
    );


    ctx.strokeStyle =
        `rgba(
            255,
            255,
            255,
            ${0.18 + energy * 0.45}
        )`;


    ctx.lineWidth =
        2 * dpr;


    ctx.stroke();


    ctx.shadowBlur = 0;


    // ========================================================
    // CORE DOT
    // ========================================================

    const coreSize =
        (
            4 +
            energy * 10
        ) * dpr;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coreSize,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        `rgba(
            255,
            255,
            255,
            ${0.45 + energy * 0.55}
        )`;


    ctx.fill();


    ctx.restore();
}


// ============================================================
// WAVE LAYER
// ============================================================

function drawWaveLayer(
    centerX,
    centerY,
    baseRadius,
    totalPoints,
    ampMultiplier,
    alpha,
    lineWidth,
    blur,
    sensitivity,
    frequencyOffset = 0
) {

    const points = [];


    // ========================================================
    // CREATE POINTS
    // ========================================================

    for (
        let i = 0;
        i < totalPoints;
        i++
    ) {

        const normalized =
            i / totalPoints;


        /*
            圓形波形映射到 FFT
        */

        let dataIndex =
            Math.floor(
                normalized *
                smoothedDataArray.length *
                0.72
            );


        dataIndex =
            Math.min(
                dataIndex,
                smoothedDataArray.length - 1
            );


        let value =
            smoothedDataArray[
                dataIndex
            ];


        // ====================================================
        // SENSITIVITY CURVE
        // ====================================================

        value =
            Math.pow(
                value / 255,
                0.68
            ) * 255;


        // ====================================================
        // HIGH FREQUENCY DETAIL
        // ====================================================

        const detail =
            (
                Math.sin(
                    normalized *
                    Math.PI *
                    16 +
                    frequencyOffset
                ) *
                0.5 +
                0.5
            );


        value *=
            0.82 +
            detail * 0.18;


        // ====================================================
        // RIPPLE
        // ====================================================

        const ripple =
            (
                value / 255
            ) *
            72 *
            dpr *
            ampMultiplier *
            sensitivity;


        const radius =
            baseRadius +
            ripple;


        const angle =
            normalized *
            Math.PI *
            2 -
            Math.PI / 2;


        points.push({

            x:
                centerX +
                radius *
                Math.cos(angle),

            y:
                centerY +
                radius *
                Math.sin(angle)
        });
    }


    // ========================================================
    // DRAW CURVE
    // ========================================================

    ctx.beginPath();


    const first =
        points[0];


    ctx.moveTo(
        first.x,
        first.y
    );


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const current =
            points[i];


        const next =
            points[
                (i + 1) %
                points.length
            ];


        const midX =
            (
                current.x +
                next.x
            ) / 2;


        const midY =
            (
                current.y +
                next.y
            ) / 2;


        ctx.quadraticCurveTo(
            current.x,
            current.y,
            midX,
            midY
        );
    }


    ctx.closePath();


    // ========================================================
    // STYLE
    // ========================================================

    ctx.strokeStyle =
        `rgba(
            255,
            255,
            255,
            ${alpha}
        )`;


    ctx.lineWidth =
        lineWidth * dpr;


    ctx.shadowBlur =
        blur * dpr;


    ctx.shadowColor =
        `rgba(
            255,
            255,
            255,
            ${Math.min(
                1,
                alpha + 0.25
            )}
        )`;


    ctx.stroke();


    ctx.shadowBlur = 0;
}


// ============================================================
// PARTICLES
// ============================================================

const particles = [];

const PARTICLE_COUNT = 75;


function initializeParticles() {

    particles.length = 0;


    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        particles.push({

            angle:
                Math.random() *
                Math.PI *
                2,

            radius:
                180 +
                Math.random() *
                280,

            speed:
                (
                    Math.random() *
                    0.0008 +
                    0.0002
                ),

            size:
                Math.random() *
                2 +
                0.5,

            alpha:
                Math.random() *
                0.45 +
                0.05
        });
    }
}


initializeParticles();


// ============================================================
// DRAW PARTICLES
// ============================================================

function drawParticles(
    centerX,
    centerY,
    energy
) {

    for (
        const particle of particles
    ) {

        particle.angle +=
            particle.speed;


        const dynamicRadius =
            particle.radius +
            energy *
            110 *
            dpr;


        const x =
            centerX +
            Math.cos(
                particle.angle
            ) *
            dynamicRadius;


        const y =
            centerY +
            Math.sin(
                particle.angle
            ) *
            dynamicRadius;


        const alpha =
            particle.alpha *
            (
                0.35 +
                energy * 1.3
            );


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            particle.size * dpr,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${Math.min(
                    1,
                    alpha
                )}
            )`;


        ctx.fill();
    }
}


// ============================================================
// CENTER RING
// ============================================================

function drawEnergyRing(
    centerX,
    centerY,
    radius,
    energy
) {

    ctx.save();


    ctx.beginPath();


    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        `rgba(
            255,
            255,
            255,
            ${0.035 + energy * 0.12}
        )`;


    ctx.lineWidth =
        1 * dpr;


    ctx.shadowBlur =
        energy *
        12 *
        dpr;


    ctx.shadowColor =
        "rgba(255,255,255,0.5)";


    ctx.stroke();


    ctx.restore();
}


// ============================================================
// MAIN DRAW LOOP
// ============================================================

function draw() {

    requestAnimationFrame(
        draw
    );


    if (!analyser)
        return;


    // ========================================================
    // AUDIO
    // ========================================================

    const audio =
        analyzeAudio();


    const avgVolume =
        audio.average;


    const low =
        audio.low;


    const mid =
        audio.mid;


    const high =
        audio.high;


    // ========================================================
    // ENERGY
    // ========================================================

    const rawEnergy =
        Math.min(
            1,
            avgVolume / 82
        );


    /*
        平滑整體能量
    */

    currentEnergy +=
        (
            rawEnergy -
            currentEnergy
        ) * 0.12;


    const energy =
        currentEnergy;


    // ========================================================
    // ATTACK
    // ========================================================

    const attack =
        Math.max(
            0,
            energy -
            previousEnergy
        );


    previousEnergy =
        energy;


    // ========================================================
    // PULSE
    // ========================================================

    targetPulse =
        energy *
        75 *
        dpr +
        attack *
        90 *
        dpr;


    currentPulse +=
        (
            targetPulse -
            currentPulse
        ) * 0.16;


    // ========================================================
    // BACKGROUND
    // ========================================================

    /*
        黑色拖影

        不完全清除畫面，
        讓波形留下非常淡的殘影。
    */

    ctx.fillStyle =
        "rgba(5,5,5,0.28)";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ========================================================
    // CENTER
    // ========================================================

    const centerX =
        canvas.width / 2;


    const centerY =
        canvas.height / 2;


    // ========================================================
    // ROTATION
    // ========================================================

    const now =
        performance.now();


    /*
        低頻觸發旋轉

        聲音越強，
        旋轉越有可能發生。
    */

    if (
        low > 18 &&
        energy > 0.12 &&
        now -
        lastRotateTime >
        1000
    ) {

        targetHexAngle +=
            Math.PI / 3;


        lastRotateTime =
            now;
    }


    /*
        微弱持續旋轉
    */

    targetHexAngle +=
        (
            low / 255
        ) *
        0.0008;


    currentHexAngle +=
        (
            targetHexAngle -
            currentHexAngle
        ) * 0.045;


    // ========================================================
    // BASE RADIUS
    // ========================================================

    /*
        原本約 100

        現在：
        150
    */

    const centerBaseRadius =
        150 * dpr;


    // ========================================================
    // ENERGY RING
    // ========================================================

    drawEnergyRing(
        centerX,
        centerY,
        centerBaseRadius +
        115 * dpr +
        currentPulse * 0.25,
        energy
    );


    // ========================================================
    // PARTICLES
    // ========================================================

    drawParticles(
        centerX,
        centerY,
        energy
    );


    // ========================================================
    // WAVE BASE
    // ========================================================

    const waveBaseRadius =
        centerBaseRadius +
        62 * dpr +
        currentPulse * 0.35;


    const totalPoints =
        220;


    // ========================================================
    // OUTER WAVE
    // ========================================================

    drawWaveLayer(
        centerX,
        centerY,
        waveBaseRadius +
        8 * dpr,
        totalPoints,
        1.55,
        0.10,
        7,
        38,
        1.35,
        performance.now() * 0.0003
    );


    // ========================================================
    // MAIN WAVE
    // ========================================================

    drawWaveLayer(
        centerX,
        centerY,
        waveBaseRadius,
        totalPoints,
        1.25,
        0.32,
        4,
        20,
        1.65,
        performance.now() * 0.0006
    );


    // ========================================================
    // DETAIL WAVE
    // ========================================================

    drawWaveLayer(
        centerX,
        centerY,
        waveBaseRadius -
        5 * dpr,
        totalPoints,
        0.90,
        0.72,
        2,
        8,
        2.15,
        performance.now() * 0.001
    );


    // ========================================================
    // HIGH FREQUENCY WAVE
    // ========================================================

    drawWaveLayer(
        centerX,
        centerY,
        waveBaseRadius +
        15 * dpr,
        totalPoints,
        0.65,
        0.30 +
        high / 255 * 0.35,
        1,
        4,
        2.8,
        performance.now() * 0.0015
    );


    // ========================================================
    // CENTER HEXAGON
    // ========================================================

    drawCenterHexagon(
        centerX,
        centerY,
        centerBaseRadius,
        currentPulse,
        currentHexAngle,
        energy,
        high
    );


    // ========================================================
    // STATUS
    // ========================================================

    if (
        audioElement.paused
    ) {

        status.textContent =
            "PAUSED";

    } else if (
        energy > 0.15
    ) {

        status.textContent =
            "VOICE DETECTED";

    } else {

        status.textContent =
            "LISTENING";
    }
}


// ============================================================
// AUDIO EVENTS
// ============================================================

audioElement.addEventListener(
    "play",
    function () {

        status.textContent =
            "LISTENING";
    }
);


audioElement.addEventListener(
    "pause",
    function () {

        status.textContent =
            "PAUSED";
    }
);


audioElement.addEventListener(
    "ended",
    function () {

        status.textContent =
            "AUDIO COMPLETE";
    }
);


// ============================================================
// INITIAL BACKGROUND
// ============================================================

function drawIdleScreen() {

    ctx.fillStyle =
        "#050505";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const centerX =
        canvas.width / 2;


    const centerY =
        canvas.height / 2;


    /*
        沒有音訊時，
        先畫一個非常淡的核心。
    */

    const idlePulse =
        (
            Math.sin(
                performance.now() *
                0.0015
            ) *
            0.5 +
            0.5
        );


    ctx.save();


    ctx.globalAlpha =
        0.12 +
        idlePulse * 0.04;


    createHexagonPath(
        150 * dpr
    );


    ctx.translate(
        centerX,
        centerY
    );


    ctx.fillStyle =
        "rgba(255,255,255,0.12)";


    ctx.fill();


    ctx.restore();


    requestAnimationFrame(
        drawIdleScreen
    );
}


drawIdleScreen();

</script>

</body>
</html>
