<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shape Room Visualizer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#stageCanvas{display:block;width:100vw;height:100vh;background:#000;cursor:pointer}
#audioUpload,#audioElement{display:none}
</style>
</head>
<body>
<canvas id="stageCanvas"></canvas>
<input type="file" id="audioUpload" accept=".mp3,.wav,.ogg,audio/*">
<audio id="audioElement"></audio>
<script>
"use strict";

const canvas=document.getElementById("stageCanvas");
const ctx=canvas.getContext("2d");
const audioUpload=document.getElementById("audioUpload");
const audioElement=document.getElementById("audioElement");

const roomImage=new Image();
roomImage.src="IMG_0165.png";

const ROOM_ASPECT=3/2;
const SCREEN_RECT={x:0.3578,y:0.3028,w:0.2838,h:0.1924};

let dpr=1,cw=0,ch=0;
let audioCtx=null,analyser=null,source=null,dataArray=null,smooth=null;
let energy=0,bassEnergy=0,midEnergy=0,highEnergy=0;
let dimLevel=0,playLevel=0,shapeScale=0.60,rotation=0,lastTime=0;
let objectURL=null;

function resizeCanvas(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=window.innerWidth;
  ch=window.innerHeight;
  canvas.width=Math.max(1,Math.floor(cw*dpr));
  canvas.height=Math.max(1,Math.floor(ch*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

function getStageRect(){
  let w=cw,h=w/ROOM_ASPECT;
  if(h>ch){h=ch;w=h*ROOM_ASPECT;}
  return {x:(cw-w)/2,y:(ch-h)/2,w,h};
}

function getScreenRect(stage){
  return {
    x:stage.x+stage.w*SCREEN_RECT.x,
    y:stage.y+stage.h*SCREEN_RECT.y,
    w:stage.w*SCREEN_RECT.w,
    h:stage.h*SCREEN_RECT.h
  };
}

async function ensureAudioGraph(){
  if(audioCtx) return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=1024;
  analyser.minDecibels=-90;
  analyser.maxDecibels=-10;
  analyser.smoothingTimeConstant=0.22;
  source=audioCtx.createMediaElementSource(audioElement);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  dataArray=new Uint8Array(analyser.frequencyBinCount);
  smooth=new Float32Array(analyser.frequencyBinCount);
}

function hasLoadedAudio(){
  return !!audioElement.src;
}

canvas.addEventListener("click",async()=>{
  if(!hasLoadedAudio()){
    audioUpload.click();
    return;
  }
  if(audioCtx&&audioCtx.state==="suspended") await audioCtx.resume();
  if(audioElement.paused) audioElement.play().catch(()=>{});
  else audioElement.pause();
});

window.addEventListener("keydown",async(e)=>{
  if(e.code==="Space"){
    e.preventDefault();
    if(!hasLoadedAudio()){
      audioUpload.click();
      return;
    }
    if(audioCtx&&audioCtx.state==="suspended") await audioCtx.resume();
    if(audioElement.paused) audioElement.play().catch(()=>{});
    else audioElement.pause();
  }else if(e.key.toLowerCase()==="o"){
    audioUpload.click();
  }
});

audioUpload.addEventListener("change",async function(){
  const file=this.files&&this.files[0];
  if(!file) return;
  if(objectURL) URL.revokeObjectURL(objectURL);
  objectURL=URL.createObjectURL(file);
  audioElement.src=objectURL;
  await ensureAudioGraph();
  if(audioCtx.state==="suspended") await audioCtx.resume();
  audioElement.currentTime=0;
  audioElement.play().catch(()=>{});
});

audioElement.addEventListener("ended",()=>{
  audioElement.currentTime=0;
});

function analyzeAudio(){
  if(!analyser||!dataArray||!smooth) return {avg:0,low:0,mid:0,high:0};
  analyser.getByteFrequencyData(dataArray);
  let sum=0,low=0,mid=0,high=0;
  const n=dataArray.length;
  for(let i=0;i<n;i++){
    const raw=dataArray[i];
    const blend=raw>smooth[i]?0.40:0.12;
    smooth[i]+=(raw-smooth[i])*blend;
    const v=smooth[i];
    sum+=v;
    const p=i/n;
    if(p<0.28) low+=v;
    else if(p<0.65) mid+=v;
    else high+=v;
  }
  return {
    avg:sum/n,
    low:low/Math.max(1,n*0.28),
    mid:mid/Math.max(1,n*0.37),
    high:high/Math.max(1,n*0.35)
  };
}

function drawHex(cx,cy,radius,rotationAngle,lineWidth,strokeStyle,fillStyle,shadowBlur){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotationAngle);
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3-Math.PI/2;
    const x=Math.cos(a)*radius;
    const y=Math.sin(a)*radius;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  if(fillStyle){
    ctx.fillStyle=fillStyle;
    ctx.fill();
  }
  if(lineWidth>0){
    ctx.lineWidth=lineWidth;
    ctx.strokeStyle=strokeStyle;
    ctx.shadowBlur=shadowBlur||0;
    ctx.shadowColor=strokeStyle;
    ctx.stroke();
  }
  ctx.restore();
}

function drawVisualizer(screen,now){
  const isPlaying=!audioElement.paused&&!audioElement.ended;
  const targetDim=isPlaying?0.62:0;
  const targetPlay=isPlaying?1:0;
  dimLevel+=(targetDim-dimLevel)*0.06;
  playLevel+=(targetPlay-playLevel)*0.06;

  const audio=analyser?analyzeAudio():{avg:0,low:0,mid:0,high:0};
  const targetEnergy=Math.min(1,audio.avg/70);
  energy+=(targetEnergy-energy)*0.12;
  bassEnergy+=(audio.low-bassEnergy)*0.18;
  midEnergy+=(audio.mid-midEnergy)*0.15;
  highEnergy+=(audio.high-highEnergy)*0.22;
  rotation+=0.0025+energy*0.015;

  const cx=screen.x+screen.w/2;
  const cy=screen.y+screen.h/2;
  const minSide=Math.min(screen.w,screen.h);
  const idleScale=0.56;
  const activeScale=0.94;
  const targetScale=idleScale+(activeScale-idleScale)*playLevel+energy*0.10;
  shapeScale+=(targetScale-shapeScale)*0.08;

  ctx.save();
  ctx.beginPath();
  ctx.rect(screen.x,screen.y,screen.w,screen.h);
  ctx.clip();

  const grad=ctx.createLinearGradient(screen.x,screen.y,screen.x,screen.y+screen.h);
  grad.addColorStop(0,"#06080d");
  grad.addColorStop(0.55,"#020305");
  grad.addColorStop(1,"#090b10");
  ctx.fillStyle=grad;
  ctx.fillRect(screen.x,screen.y,screen.w,screen.h);

  const vignette=ctx.createRadialGradient(cx,cy,minSide*0.05,cx,cy,minSide*0.75);
  vignette.addColorStop(0,"rgba(22,26,34,0.10)");
  vignette.addColorStop(1,"rgba(0,0,0,0.72)");
  ctx.fillStyle=vignette;
  ctx.fillRect(screen.x,screen.y,screen.w,screen.h);

  const glowAlpha=0.14+playLevel*0.18+energy*0.16;
  ctx.strokeStyle=`rgba(255,255,255,${glowAlpha})`;
  ctx.lineWidth=Math.max(1,minSide*0.006);
  ctx.shadowBlur=minSide*0.06;
  ctx.shadowColor=`rgba(255,255,255,${0.35+playLevel*0.25})`;
  ctx.beginPath();
  ctx.arc(cx,cy,minSide*0.22*shapeScale,0,Math.PI*2);
  ctx.stroke();

  ctx.shadowBlur=minSide*0.03;
  ctx.lineWidth=Math.max(1,minSide*0.0035);
  ctx.strokeStyle=`rgba(255,255,255,${0.10+playLevel*0.12})`;
  ctx.beginPath();
  ctx.arc(cx,cy,minSide*0.31*shapeScale,0,Math.PI*2);
  ctx.stroke();

  const innerR=minSide*0.12*shapeScale*(1+energy*0.12);
  const outerR=minSide*0.18*shapeScale*(1+energy*0.08);
  drawHex(cx,cy,outerR,rotation*0.42,Math.max(1,minSide*0.004),`rgba(255,255,255,${0.10+playLevel*0.14})`,null,minSide*0.018);
  drawHex(cx,cy,innerR,rotation,Math.max(1.1,minSide*0.008),`rgba(255,255,255,${0.34+playLevel*0.32+energy*0.18})`,`rgba(255,255,255,${0.28+playLevel*0.20+energy*0.14})`,minSide*0.028);
  drawHex(cx,cy,innerR*0.58,rotation,0,null,"rgba(7,9,12,0.92)",0);

  ctx.shadowBlur=minSide*0.045;
  ctx.shadowColor="rgba(255,255,255,0.9)";
  ctx.fillStyle=`rgba(255,255,255,${0.55+playLevel*0.25+energy*0.15})`;
  ctx.beginPath();
  ctx.arc(cx,cy,Math.max(1.8,minSide*0.018*(1+energy*0.2)),0,Math.PI*2);
  ctx.fill();

  if(playLevel>0.02||energy>0.03){
    ctx.shadowBlur=minSide*0.02;
    ctx.shadowColor="rgba(255,255,255,0.5)";
    ctx.lineWidth=Math.max(0.8,minSide*0.0026);
    for(let i=0;i<3;i++){
      const phase=now*0.0012+i*Math.PI*2/3;
      const radius=minSide*(0.24+0.045*i)*shapeScale + Math.sin(phase)*minSide*0.01*energy;
      const start=phase;
      const span=0.5+Math.min(1,bassEnergy/255)*0.9;
      ctx.strokeStyle=`rgba(255,255,255,${0.08+playLevel*0.11-i*0.015})`;
      ctx.beginPath();
      ctx.arc(cx,cy,radius,start,start+span);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawFrame(now){
  requestAnimationFrame(drawFrame);
  const dt=Math.min(40,now-lastTime||16);
  lastTime=now;

  ctx.clearRect(0,0,cw,ch);
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,cw,ch);

  const stage=getStageRect();
  if(roomImage.complete&&roomImage.naturalWidth>0){
    ctx.drawImage(roomImage,stage.x,stage.y,stage.w,stage.h);
  }

  const screen=getScreenRect(stage);
  drawVisualizer(screen,now);

  if(dimLevel>0.001){
    ctx.fillStyle=`rgba(0,7,18,${dimLevel})`;
    ctx.fillRect(stage.x,stage.y,stage.w,stage.h);
    drawVisualizer(screen,now);
  }
}

roomImage.addEventListener("load",()=>requestAnimationFrame(drawFrame));
if(roomImage.complete) requestAnimationFrame(drawFrame);
</script>
</body>
</html>
