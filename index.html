<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Human Verification Test #67 - Stage Projection</title>
<link rel="preload" href="assets/backgrounds/Start_dark.PNG" as="image">
<link rel="preload" href="assets/backgrounds/IMG_0165.png" as="image">
<link rel="preload" href="assets/backgrounds/memory-room.png" as="image">
<link rel="preload" href="assets/backgrounds/office-memory.png" as="image">
<link rel="stylesheet" href="stage.css">
</head>
<body data-started="false" data-view="page" data-preview-cue="dark">
<main id="showShell">
  <div id="projectionViewport">
    <div id="visualizerWrap" tabindex="-1">
      <canvas id="visualizer" aria-label="16:9 劇場投影；開始後空白鍵、右鍵或點一下換下一句，左鍵上一句"></canvas>
      <div id="subtitles" aria-live="off" hidden><div id="subtitleSpeaker"></div><div id="subtitleText"></div></div>
      <video id="roomRevealVideo" preload="auto" muted playsinline disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
      <audio id="openingAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="actOneBgm" preload="none" aria-hidden="true" tabindex="-1"></audio>
      <audio id="actOneBgmAlt" preload="none" aria-hidden="true" tabindex="-1"></audio>
      <audio id="doorKickAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="memoryDoorOpenAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="memoryWelcomeAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="memoryLightAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="officeBangAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="selectionButtonAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="selectionPromptAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="selectionOneAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="selectionTwoAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="selectionFinalAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="endingCompleteAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="endingRevealAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
    </div>
  </div>
  <output id="volumeDisplay" aria-label="語音、音效與背景音樂音量" aria-live="off">語音 100%
音效 100%
背景音樂 100%</output>
  <aside id="stepsPanel" aria-label="演出步驟檢視" hidden>
    <header><h1>演出步驟<span>32</span></h1><p>點選預覽，不播放影音</p>
    </header>
    <ol id="stepList">
      <li><button type="button" data-preview="dark" aria-pressed="true"><span class="step-number">00</span><span>藍色房間<small>第 0 步 · 無字幕、無音效，等待切換</small></span></button></li>
      <li><button type="button" data-preview="bright" aria-pressed="false"><span class="step-number">01</span><span>暗 → 亮<small>影片播完，接回原本房間</small></span></button></li>
      <li><button type="button" data-preview="ai" aria-pressed="false"><span class="step-number">02</span><span>AI 漸顯<small>電視正中央 · 填滿內框</small></span></button></li>
      <li><button type="button" data-preview="welcome" aria-pressed="false"><span class="step-number">03</span><span>歡迎語音<small>圖形放大、背景漸至全黑</small></span></button></li>
      <li><button type="button" data-preview="clock" aria-pressed="false"><span class="step-number">04</span><span>顯示碼錶<small>語音中可切換，播完開始倒數</small></span></button></li>
      <li><button type="button" data-preview="door-kick" aria-pressed="false"><span class="step-number">05</span><span>踢門音效<small>碼錶保持顯示，音效播完再繼續</small></span></button></li>
      <li><button type="button" data-preview="card" aria-pressed="false"><span class="step-number">06</span><span>顯示卡片<small>Access to One’s Memory</small></span></button></li>
      <li><button type="button" data-preview="card-hidden" aria-pressed="false"><span class="step-number">07</span><span>隱藏卡片<small>倒數繼續</small></span></button></li>
      <li><button type="button" data-preview="door-open" aria-pressed="false"><span class="step-number">08</span><span>記憶室開門音效<small>開門聲結束後，再進入全暗</small></span></button></li>
      <li><button type="button" data-preview="blackout" aria-pressed="false"><span class="step-number">09</span><span>全暗<small>記憶室進場，等待台詞</small></span></button></li>
      <li class="scene-divider">第一幕 · 第二場</li>
      <li><button type="button" data-preview="memory-light" aria-pressed="false"><span class="step-number">10</span><span>記憶室亮起<small>Where’s the light?</small></span></button></li>
      <li><button type="button" data-preview="memory-welcome" aria-pressed="false"><span class="step-number">11</span><span>記憶室 AI<small>語音中圖形放大，播完縮回</small></span></button></li>
      <li><button type="button" data-preview="memory-room" aria-pressed="false"><span class="step-number">12</span><span>演員對話<small>AI 退場，保留房間</small></span></button></li>
      <li><button type="button" data-preview="memory-blackout" aria-pressed="false"><span class="step-number">13</span><span>記憶室全暗<small>Go ahead. → 獨白進場</small></span></button></li>
      <li class="scene-divider">第二幕 · 第一場</li>
      <li><button type="button" data-preview="past-intro" aria-pressed="false"><span class="step-number">14</span><span>Christopher 獨白<small>房間稍暗，演員走到中央</small></span></button></li>
      <li><button type="button" data-preview="past-isolate" aria-pressed="false"><span class="step-number">15</span><span>只留中央追光<small>投影全暗 · There was this guy.</small></span></button></li>
      <li class="scene-divider">第二幕 · 第二場</li>
      <li><button type="button" data-preview="office-light" aria-pressed="false"><span class="step-number">16</span><span>辦公室回憶<small>Liam 進場，保留演員對話</small></span></button></li>
      <li><button type="button" data-preview="office-bang" aria-pressed="false"><span class="step-number">17</span><span>BANG · Ben 進場<small>音效待補，背景停留</small></span></button></li>
      <li class="scene-divider">第二幕 · 第三場</li>
      <li><button type="button" data-preview="past-reflection" aria-pressed="false"><span class="step-number">18</span><span>回憶退場 · 自白<small>Liam 離場後，投影全暗</small></span></button></li>
      <li><button type="button" data-preview="memory-return" aria-pressed="false"><span class="step-number">19</span><span>回到記憶室<small>自白結束，等待第三幕</small></span></button></li>
      <li class="scene-divider">第三幕 · 討論與選擇</li>
      <li><button type="button" data-preview="discussion" aria-pressed="false"><span class="step-number">20</span><span>演員討論<small>房間稍暗，保留對話時間</small></span></button></li>
      <li><button type="button" data-preview="vote-prompt" aria-pressed="false"><span class="step-number">21</span><span>AI 要求選擇<small>Christopher 按下實體按鈕</small></span></button></li>
      <li><button type="button" data-preview="vote-one" aria-pressed="false"><span class="step-number">22</span><span>Ethan · 一票<small>Christopher 說 Ethan.</small></span></button></li>
      <li><button type="button" data-preview="vote-two" aria-pressed="false"><span class="step-number">23</span><span>Ethan · 兩票<small>Megan 說 Ethan.</small></span></button></li>
      <li><button type="button" data-preview="vote-final" aria-pressed="false"><span class="step-number">24</span><span>最後選擇<small>Rachel 沒有回答之後</small></span></button></li>
      <li><button type="button" data-preview="vote-blackout" aria-pressed="false"><span class="step-number">25</span><span>第三幕全暗<small>最後提示結束，等待第四幕</small></span></button></li>
      <li class="scene-divider">第四幕 · 測試結束與真相</li>
      <li><button type="button" data-preview="ending-light" aria-pressed="false"><span class="step-number">26</span><span>記憶室重新亮起<small>原稿 p407 · 第四幕音樂開始</small></span></button></li>
      <li><button type="button" data-preview="ending-dialogue" aria-pressed="false"><span class="step-number">27</span><span>Ethan 對話<small>I... I didn't explode...?</small></span></button></li>
      <li><button type="button" data-preview="ending-complete" aria-pressed="false"><span class="step-number">28</span><span>AI 宣布測試完成<small>原稿 p409 · 播放 404-406ai.m4a</small></span></button></li>
      <li><button type="button" data-preview="ending-question" aria-pressed="false"><span class="step-number">29</span><span>眾人追問真相<small>What...? · Then who is the robot?</small></span></button></li>
      <li><button type="button" data-preview="ending-reveal" aria-pressed="false"><span class="step-number">30</span><span>AI 揭露真相<small>原稿 p414 · 播放 411-415ai.m4a</small></span></button></li>
      <li><button type="button" data-preview="ending-blackout" aria-pressed="false"><span class="step-number">31</span><span>最終全暗<small>You may leave. · 音樂淡出</small></span></button></li>
    </ol>
  </aside>
</main>
<nav id="reviewControls" aria-label="檢視模式">
  <button type="button" id="pageViewButton" aria-pressed="true">全頁</button>
  <button type="button" id="stepsViewButton" aria-pressed="false">步驟檢視</button>
  <button type="button" id="modeButton">場景模式</button>
</nav>
<div id="startDock">
  <button type="button" id="startButton" aria-keyshortcuts="F" disabled><span class="play-mark" aria-hidden="true"></span><span id="startLabel">載入中…</span></button>
  <button type="button" id="resetStartStep" hidden>取消指定步驟，改從開頭開始</button>
  <p id="startStatus" role="status" aria-live="polite"></p>
</div>
<script src="opening-config.js"></script>
<script src="stage-layout.js"></script>
<script src="opening-controller.js"></script>
<script src="act-one-audio.js"></script>
<script src="script-data.js"></script>
<script src="script-controller.js"></script>
<script src="visualizer.js"></script>
<script src="subtitle-motion.js"></script>
<script src="script-runtime.js"></script>
<script src="audio-timeline.js"></script>
<script src="stage-review.js"></script>
</body>
</html>
