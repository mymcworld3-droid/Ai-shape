<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Human Verification Test #67 - Stage Projection</title>
<link rel="preload" href="assets/backgrounds/Start_dark.PNG" as="image">
<link rel="preload" href="assets/backgrounds/IMG_0165.png" as="image">
<link rel="preload" href="assets/backgrounds/memory-room.png" as="image">
<link rel="stylesheet" href="stage.css">
</head>
<body data-started="false" data-view="page" data-preview-cue="dark">
<main id="showShell">
  <div id="projectionViewport">
    <div id="visualizerWrap" tabindex="-1">
      <canvas id="visualizer" aria-label="16:9 劇場投影；開始後按空白鍵或點一下畫面推進"></canvas>
      <video id="roomRevealVideo" preload="auto" muted playsinline disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
      <audio id="openingAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="doorKickAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="memoryWelcomeAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
      <audio id="memoryLightAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
    </div>
  </div>
  <aside id="stepsPanel" aria-label="演出步驟檢視" hidden>
    <header><h1>演出步驟<span>12</span></h1><p>點選預覽，不播放影音</p></header>
    <ol id="stepList">
      <li><button type="button" data-preview="bright" aria-pressed="true"><span class="step-number">01</span><span>暗 → 亮<small>影片播完，接回原本房間</small></span></button></li>
      <li><button type="button" data-preview="ai" aria-pressed="false"><span class="step-number">02</span><span>AI 漸顯<small>電視正中央 · 填滿內框</small></span></button></li>
      <li><button type="button" data-preview="door-kick" aria-pressed="false"><span class="step-number">03</span><span>踢門音效<small>音效待補</small></span></button></li>
      <li><button type="button" data-preview="welcome" aria-pressed="false"><span class="step-number">04</span><span>歡迎語音<small>放大，播完自動縮小</small></span></button></li>
      <li><button type="button" data-preview="clock" aria-pressed="false"><span class="step-number">05</span><span>顯示碼錶<small>語音播完才開始倒數</small></span></button></li>
      <li><button type="button" data-preview="card" aria-pressed="false"><span class="step-number">06</span><span>顯示卡片<small>MEMORY ACCESS</small></span></button></li>
      <li><button type="button" data-preview="card-hidden" aria-pressed="false"><span class="step-number">07</span><span>隱藏卡片<small>倒數繼續</small></span></button></li>
      <li><button type="button" data-preview="blackout" aria-pressed="false"><span class="step-number">08</span><span>全暗<small>記憶室進場，等待台詞</small></span></button></li>
      <li class="scene-divider">第一幕 · 第二場</li>
      <li><button type="button" data-preview="memory-light" aria-pressed="false"><span class="step-number">09</span><span>記憶室亮起<small>Where’s the light?</small></span></button></li>
      <li><button type="button" data-preview="memory-welcome" aria-pressed="false"><span class="step-number">10</span><span>記憶室 AI<small>Welcome to the Memory Room.</small></span></button></li>
      <li><button type="button" data-preview="memory-room" aria-pressed="false"><span class="step-number">11</span><span>演員對話<small>AI 退場，保留房間</small></span></button></li>
      <li><button type="button" data-preview="memory-blackout" aria-pressed="false"><span class="step-number">12</span><span>記憶室全暗<small>第二場結束，等待下一幕</small></span></button></li>
    </ol>
  </aside>
</main>
<nav id="reviewControls" aria-label="檢視模式">
  <button type="button" id="pageViewButton" aria-pressed="true">全頁</button>
  <button type="button" id="stepsViewButton" aria-pressed="false">步驟檢視</button>
</nav>
<div id="startDock">
  <button type="button" id="startButton" disabled><span class="play-mark" aria-hidden="true"></span><span id="startLabel">載入中…</span></button>
  <p id="startStatus" role="status" aria-live="polite"></p>
</div>
<script src="opening-config.js"></script>
<script src="stage-layout.js"></script>
<script src="opening-controller.js"></script>
<script src="visualizer.js"></script>
<script src="stage-review.js"></script>
</body>
</html>
