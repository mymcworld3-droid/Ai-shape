<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Assistant Visualizer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
#controls{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 12px;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
#audioUpload{max-width:220px;color:#fff;font-size:12px}
#audioUpload::file-selector-button{margin-right:7px;padding:6px 10px;border:0;border-radius:7px;background:#fff;color:#000;cursor:pointer;font-weight:600}
#audioElement{width:240px;height:32px}
#timerToggle{padding:8px 14px;border:1px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(255,255,255,.09);color:#fff;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
#timerToggle:hover{background:rgba(255,255,255,.19)}
#timerToggle[aria-pressed="true"]{background:rgba(255,255,255,.23);border-color:#fff}
#timerToggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
#freqControls,#shapeControls{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap}
#freqControls label,#shapeControls label{display:flex;align-items:center;gap:5px}
#freqControls input[type=range],#shapeControls input[type=range]{width:105px;accent-color:#fff}
#freqMinValue,#freqMaxValue,#shapeXValue,#shapeYValue,#shapeSizeValue{display:inline-block;min-width:48px;text-align:right;color:#fff;font-variant-numeric:tabular-nums}
#shapeControls{padding-left:10px;border-left:1px solid rgba(255,255,255,.12)}
#shapeControls input:disabled{opacity:.35;cursor:not-allowed}
#shapeControls.disabled{opacity:.48}
#visualizerWrap{position:relative;min-height:0;overflow:hidden;background:#050505}
#visualizer{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:relative;z-index:2;text-align:center;padding:7px 12px;background:rgba(10,10,10,.96);border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.55);font-size:10px;letter-spacing:2px;pointer-events:none}
@media(max-width:900px){#shapeControls{width:100%;justify-content:center;border-left:0;padding-left:0;flex-wrap:wrap}}
@media(max-width:700px){body{grid-template-rows:auto minmax(0,1fr) auto}#controls{flex-direction:column;gap:6px;padding:7px 10px}#audioUpload,#audioElement{width:100%;max-width:none}#audioElement{height:30px}#freqControls,#shapeControls{width:100%;justify-content:center;flex-wrap:wrap}#freqControls input[type=range],#shapeControls input[type=range]{width:120px}}
</style>
</head>
<body>
<div id="controls">
<input type="file" id="audioUpload" accept=".mp3,.wav,.ogg,audio/*">
<audio id="audioElement" controls></audio>
<button id="timerToggle" type="button" aria-pressed="false">計時器 · 15:00</button>
<div id="freqControls" aria-label="音頻顯示範圍">
 <span>頻率範圍</span>
 <label>低 <input id="freqMin" type="range" min="20" max="20000" step="10" value="20"><span id="freqMinValue">20 Hz</span></label>
 <label>高 <input id="freqMax" type="range" min="20" max="20000" step="10" value="20000"><span id="freqMaxValue">20 kHz</span></label>
</div>
<div id="shapeControls" aria-label="播放前初始圖形設定">
 <span>初始圖形</span>
 <label>X <input id="shapeX" type="range" min="0" max="100" step="1" value="50"><span id="shapeXValue">50%</span></label>
 <label>Y <input id="shapeY" type="range" min="0" max="100" step="1" value="50"><span id="shapeYValue">50%</span></label>
 <label>大小 <input id="shapeSize" type="range" min="30" max="220" step="1" value="100"><span id="shapeSizeValue">100%</span></label>
</div>
</div>
<div id="visualizerWrap"><canvas id="visualizer"></canvas></div>
<div id="status">SET INITIAL SHAPE / CHOOSE AUDIO</div>
<script>
"use strict";
const audioUpload=document.getElementById("audioUpload");
const audioElement=document.getElementById("audioElement");
const canvas=document.getElementById("visualizer");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const timerToggle=document.getElementById("timerToggle");
const freqMinInput=document.getElementById("freqMin");
const freqMaxInput=document.getElementById("freqMax");
const freqMinValue=document.getElementById("freqMinValue");
const freqMaxValue=document.getElementById("freqMaxValue");
const shapeControls=document.getElementById("shapeControls");
const shapeXInput=document.getElementById("shapeX");
const shapeYInput=document.getElementById("shapeY");
const shapeSizeInput=document.getElementById("shapeSize");
const shapeXValue=document.getElementById("shapeXValue");
const shapeYValue=document.getElementById("shapeYValue");
const shapeSizeValue=document.getElementById("shapeSizeValue");
const backgroundImage=new Image();
let backgroundReady=false;
backgroundImage.src="IMG_0165.png";
backgroundImage.addEventListener("load",()=>{backgroundReady=true});
backgroundImage.addEventListener("error",()=>{backgroundReady=false});
let audioCtx=null,analyser=null,source=null,dataArray=null,smooth=new Float32Array(512);
let dpr=1,w=0,h=0,cx=0,cy=0,scale=1;
let energy=0,bassEnergy=0,midEnergy=0,highEnergy=0,pulse=0,rotation=0,lastTime=0;
let rotationTarget=0,rotationMoving=false,rotationMoveStart=0,rotationStart=0;
const ROTATE_INTERVAL=500;
const ROTATE_DURATION=1400;
const ROTATE_STEP=Math.PI/3;
const SCENE_DURATION=1600;
const TIMER_DURATION_MS=15*60*1000;
const TIMER_MORPH_DURATION=1200;
const particles=[];
const PARTICLES=90;
let freqMin=20,freqMax=20000;
let idleXPercent=50,idleYPercent=50,idleSizePercent=100;
let sceneProgress=0,sceneTarget=0,sceneFrom=0,sceneStart=0,sceneTransitioning=false;
let timerActive=false,timerMorph=0,timerMorphFrom=0,timerMorphTo=0,timerMorphStart=0;
let timerRemainingMs=TIMER_DURATION_MS,timerDeadline=null,timerState="idle",timerLastSecond=-1;

function formatFreq(v){return v>=1000?(v/1000).toFixed(v%1000===0?0:1)+" kHz":Math.round(v)+" Hz"}
function updateFreqLabels(){
 freqMinValue.textContent=formatFreq(freqMin);
 freqMaxValue.textContent=formatFreq(freqMax);
}
function clampFreqRange(){
 freqMin=Math.max(20,Math.min(20000,Number(freqMinInput.value)));
 freqMax=Math.max(20,Math.min(20000,Number(freqMaxInput.value)));
 if(freqMin>=freqMax){
  if(document.activeElement===freqMinInput) freqMax=Math.min(20000,freqMin+10);
  else freqMin=Math.max(20,freqMax-10);
  freqMinInput.value=freqMin;
  freqMaxInput.value=freqMax;
 }
 updateFreqLabels();
}
freqMinInput.addEventListener("input",clampFreqRange);
freqMaxInput.addEventListener("input",clampFreqRange);
updateFreqLabels();

function updateShapeSettings(){
 idleXPercent=Number(shapeXInput.value);
 idleYPercent=Number(shapeYInput.value);
 idleSizePercent=Number(shapeSizeInput.value);
 shapeXValue.textContent=Math.round(idleXPercent)+"%";
 shapeYValue.textContent=Math.round(idleYPercent)+"%";
 shapeSizeValue.textContent=Math.round(idleSizePercent)+"%";
}
function setShapeControlsEnabled(enabled){
 shapeXInput.disabled=!enabled;
 shapeYInput.disabled=!enabled;
 shapeSizeInput.disabled=!enabled;
 shapeControls.classList.toggle("disabled",!enabled);
}
shapeXInput.addEventListener("input",updateShapeSettings);
shapeYInput.addEventListener("input",updateShapeSettings);
shapeSizeInput.addEventListener("input",updateShapeSettings);
updateShapeSettings();

function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function setSceneTarget(target){
 target=Math.max(0,Math.min(1,target));
 if(target===sceneTarget&&!sceneTransitioning)return;
 sceneFrom=sceneProgress;
 sceneTarget=target;
 sceneStart=performance.now();
 sceneTransitioning=true;
 setShapeControlsEnabled(false);
}
function updateScene(now){
 if(!sceneTransitioning)return;
 const p=Math.max(0,Math.min(1,(now-sceneStart)/SCENE_DURATION));
 const eased=easeInOutCubic(p);
 sceneProgress=sceneFrom+(sceneTarget-sceneFrom)*eased;
 if(p>=1){
  sceneProgress=sceneTarget;
  sceneTransitioning=false;
  if(sceneTarget===0&&!timerActive)setShapeControlsEnabled(true);
 }
}

// A timer can be armed at any time; only the media "ended" event starts it.
function resetTimer(){
 timerRemainingMs=TIMER_DURATION_MS;
 timerDeadline=null;
 timerState=timerActive?"waiting":"idle";
 timerLastSecond=-1;
}
function startTimerAfterAudio(){
 if(!timerActive||!audioElement.ended||!audioElement.src)return;
 timerDeadline=performance.now()+TIMER_DURATION_MS;
 timerState="running";
 timerRemainingMs=TIMER_DURATION_MS;
 timerLastSecond=-1;
 status.textContent="倒數中 · 15:00";
}
function updateTimer(now){
 if(timerMorph!==timerMorphTo){
  const p=Math.min(1,Math.max(0,(now-timerMorphStart)/TIMER_MORPH_DURATION));
  timerMorph=timerMorphFrom+(timerMorphTo-timerMorphFrom)*easeInOutCubic(p);
 }
 if(timerState!=="running")return;
 timerRemainingMs=Math.max(0,timerDeadline-now);
 if(timerRemainingMs===0){
  timerDeadline=null;
  timerState="done";
  status.textContent="計時結束 · 00:00";
  return;
 }
 const seconds=Math.ceil(timerRemainingMs/1000);
 if(seconds!==timerLastSecond){
  timerLastSecond=seconds;
  status.textContent="倒數中 · "+formatTimer(timerRemainingMs);
 }
}
function formatTimer(ms){
 const seconds=Math.ceil(Math.max(0,ms)/1000);
 return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
}
timerToggle.addEventListener("click",()=>{
 const now=performance.now();
 updateTimer(now);
 timerActive=!timerActive;
 timerMorphFrom=timerMorph;
 timerMorphTo=timerActive?1:0;
 timerMorphStart=now;
 resetTimer();
 timerToggle.setAttribute("aria-pressed",String(timerActive));
 timerToggle.textContent=timerActive?"還原圖形":"計時器 · 15:00";
 if(timerActive){
  setSceneTarget(0);
  setShapeControlsEnabled(false);
  if(audioElement.ended&&audioElement.src)startTimerAfterAudio();
  else status.textContent="計時器待命 · 等待音訊播放完畢";
 }else{
  setSceneTarget(!audioElement.paused&&!audioElement.ended?1:0);
  if(audioElement.paused&&!sceneTransitioning)setShapeControlsEnabled(true);
  status.textContent=audioElement.ended?"AUDIO COMPLETE":audioElement.paused?"READY - SET INITIAL SHAPE / PRESS PLAY":"LISTENING";
 }
});

function drawBackground(){
 ctx.clearRect(0,0,w,h);
 ctx.fillStyle="#050505";
 ctx.fillRect(0,0,w,h);
 if(backgroundReady&&backgroundImage.naturalWidth&&backgroundImage.naturalHeight){
  const imageScale=Math.min(w/backgroundImage.naturalWidth,h/backgroundImage.naturalHeight);
  const drawW=backgroundImage.naturalWidth*imageScale;
  const drawH=backgroundImage.naturalHeight*imageScale;
  const drawX=(w-drawW)/2;
  const drawY=(h-drawH)/2;
  ctx.drawImage(backgroundImage,drawX,drawY,drawW,drawH);
 }
 if(sceneProgress>0){
  ctx.fillStyle=`rgba(0,0,0,${Math.min(1,sceneProgress)})`;
  ctx.fillRect(0,0,w,h);
 }
}

function resizeCanvas(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 w=canvas.clientWidth;h=canvas.clientHeight;
 canvas.width=Math.max(1,Math.floor(w*dpr));canvas.height=Math.max(1,Math.floor(h*dpr));
 ctx.setTransform(dpr,0,0,dpr,0,0);
 cx=w/2;cy=h/2;
 scale=Math.min(w,h)/760;
 scale=Math.max(.48,Math.min(scale,1));
 initParticles();
}
window.addEventListener("resize",resizeCanvas);
function initParticles(){
 particles.length=0;
 const maxR=Math.min(w,h)*.47;
 for(let i=0;i<PARTICLES;i++) particles.push({a:Math.random()*Math.PI*2,r:maxR*(.55+Math.random()*.44),s:.00012+Math.random()*.00065,size:.45+Math.random()*1.5,alpha:.035+Math.random()*.19});
}
resizeCanvas();

function freqToBin(freq){
 if(!analyser||!audioCtx)return 0;
 const nyquist=audioCtx.sampleRate/2;
 return Math.max(0,Math.min(analyser.frequencyBinCount-1,Math.round(freq/nyquist*analyser.frequencyBinCount)));
}
function selectedBins(){
 const lo=freqToBin(freqMin),hi=Math.max(lo+1,freqToBin(freqMax));
 return{lo,hi:Math.min(analyser?analyser.frequencyBinCount-1:hi,hi)};
}

let objectURL=null;
audioUpload.addEventListener("change",async function(){
 const file=this.files[0];if(!file)return;
 audioElement.pause();
 resetTimer();
 setSceneTarget(0);
 if(objectURL)URL.revokeObjectURL(objectURL);
 objectURL=URL.createObjectURL(file);audioElement.src=objectURL;
 if(!audioCtx){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=1024;
  analyser.minDecibels=-90;
  analyser.maxDecibels=-10;
  analyser.smoothingTimeConstant=.22;
  source=audioCtx.createMediaElementSource(audioElement);source.connect(analyser);analyser.connect(audioCtx.destination);
  dataArray=new Uint8Array(analyser.frequencyBinCount);smooth=new Float32Array(analyser.frequencyBinCount);
 }
 smooth.fill(0);
 energy=bassEnergy=midEnergy=highEnergy=pulse=0;
 status.textContent=timerActive?"計時器待命 · 等待音訊播放完畢":"READY - SET INITIAL SHAPE / PRESS PLAY";
});
audioElement.addEventListener("play",async()=>{
 // Replaying the audio cancels any previous countdown until it ends again.
 if(timerActive)resetTimer();
 if(audioCtx&&audioCtx.state==="suspended")await audioCtx.resume();
 setSceneTarget(timerActive?0:1);
 if(timerActive)setShapeControlsEnabled(false);
 status.textContent=timerActive?"計時器待命 · 等待音訊播放完畢":"LISTENING";
});
audioElement.addEventListener("pause",()=>{
 if(!audioElement.ended)status.textContent=timerActive?"計時器待命 · 等待音訊播放完畢":"PAUSED";
});
audioElement.addEventListener("ended",()=>{
 setSceneTarget(0);
 if(timerActive)startTimerAfterAudio();
 else status.textContent="AUDIO COMPLETE";
});

function analyze(){
 if(!analyser||!dataArray)return{avg:0,low:0,mid:0,high:0};
 if(audioElement.paused||audioElement.ended){
  for(let i=0;i<smooth.length;i++)smooth[i]*=.86;
  return{avg:0,low:0,mid:0,high:0};
 }
 analyser.getByteFrequencyData(dataArray);
 let sum=0,low=0,mid=0,high=0,n=dataArray.length;
 const range=selectedBins(),lo=range.lo,hi=range.hi;
 const span=Math.max(1,hi-lo);
 for(let i=0;i<n;i++){
  const raw=dataArray[i];
  const k=raw>smooth[i] ? .42 : .12;
  smooth[i]+=(raw-smooth[i])*k;
  if(i<lo||i>hi)continue;
  const v=smooth[i];
  sum+=v;
  const p=(i-lo)/span;
  if(p<.30)low+=v;
  else if(p<.65)mid+=v;
  else high+=v;
 }
 const count=Math.max(1,hi-lo+1);
 return{avg:sum/count,low:low/Math.max(1,span*.30),mid:mid/Math.max(1,span*.35),high:high/Math.max(1,span*.35)};
}

function radialPoint(r,a){return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}}
function drawSymmetricRing(r,thickness,alpha,glow){
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
 ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=thickness;
 ctx.shadowBlur=glow;ctx.shadowColor=`rgba(255,255,255,${Math.min(.9,alpha+.16)})`;ctx.stroke();ctx.restore();
}

// Audio coil: every point is mirrored from the left/right partner. Amplitude is proportional to volume^2 * 10.
function drawCoil(base,amp,alpha,line,blur,phase,bandStart,bandEnd,shape){
 const points=300,arr=[];
 const range=selectedBins(),lo=range.lo,hi=range.hi;
 for(let i=0;i<points;i++){
  const t=i/points;
  const u=t<.5?t*2:(1-t)*2;
  const idx=Math.min(hi,Math.max(lo,Math.floor(lo+(hi-lo)*(bandStart+(bandEnd-bandStart)*u))));
  const idx2=Math.min(hi,Math.max(lo,Math.floor(lo+(hi-lo)*(bandStart+(bandEnd-bandStart)*Math.min(1,u+.018)))));
  const v=Math.max(0,Math.min(1,(smooth[idx]||0)/255));
  const v2=Math.max(0,Math.min(1,(smooth[idx2]||0)/255));
  const volumeSquared=v*v;
  const volumeSquared2=v2*v2;
  const harmonic=volumeSquared*.72+volumeSquared2*.28;
  const detail=.88+.12*Math.sin(u*Math.PI*22+phase);
  const ripple=harmonic*amp*scale*10*detail;
  const fine=(highEnergy/255)**2*3.2*scale*Math.sin(u*Math.PI*54+phase*2.1);
  const bassBend=(bassEnergy/255)**2*amp*.16*scale*Math.sin(u*Math.PI*6+phase*.55);
  const a=t*Math.PI*2-Math.PI/2;
  arr.push(radialPoint(base+ripple+fine+bassBend,a));
 }
 ctx.save();ctx.beginPath();ctx.moveTo(arr[0].x,arr[0].y);
 for(let i=0;i<points;i++){const p=arr[i],q=arr[(i+1)%points];ctx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2)}
 ctx.closePath();ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=line;ctx.shadowBlur=blur;ctx.shadowColor=`rgba(255,255,255,${Math.min(1,alpha+.22)})`;ctx.stroke();ctx.restore();
}
function drawCoilGlow(base,phase){
 drawCoil(base,52,.045,8,28,phase,.00,.72,"halo");
 drawCoil(base+2*scale,45,.075,5,20,phase*1.08+.8,.04,.78,"outer");
 drawCoil(base-1*scale,39,.18,3,13,phase*1.22+1.5,.08,.84,"mid");
 drawCoil(base-4*scale,34,.72,1.7,7,phase*1.45+2.7,.02,.90,"core");
}

function drawBassArcs(radius,audio,phase){
 const bass=Math.pow(Math.min(1,audio.low/255),2);
 ctx.save();ctx.lineCap="round";
 for(let j=0;j<3;j++){
  ctx.beginPath();
  const arcRadius=radius+(j-1)*5*scale+bass*18*scale;
  const start=phase*.55+j*Math.PI*2/3;
  const span=.55+bass*1.05;
  ctx.arc(cx,cy,arcRadius,start,start+span);
  ctx.strokeStyle=`rgba(255,255,255,${.08+bass*.16-j*.018})`;
  ctx.lineWidth=(1.2+j*.7)*scale;ctx.shadowBlur=(5+bass*15)*scale;ctx.shadowColor="rgba(255,255,255,.55)";ctx.stroke();
 }
 ctx.restore();
}

function updateHexRotation(now){
 if(!rotationMoving&&now-rotationMoveStart>=ROTATE_INTERVAL){rotationMoving=true;rotationStart=rotation;rotationTarget=rotation+ROTATE_STEP;rotationMoveStart=now}
 if(rotationMoving){
  const p=Math.max(0,Math.min(1,(now-rotationMoveStart)/ROTATE_DURATION));
  const eased=1-Math.pow(1-p,5);
  rotation=rotationStart+(rotationTarget-rotationStart)*eased;
  if(p>=1){rotation=rotationTarget;rotationMoving=false;rotationMoveStart=now}
 }
}

function drawHex(radius,rot,audio){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
 const def=[];
 const range=selectedBins(),lo=range.lo,hi=range.hi;
 for(let i=0;i<6;i++){
  const band=Math.floor(lo+(i/6)*Math.max(1,(hi-lo)*.30));
  const v=Math.max(0,Math.min(1,(smooth[Math.min(hi,band)]||0)/255));
  def[i]=(v*v)*12*scale*(.7+(audio.low/255)**2*.8);
 }
 ctx.beginPath();
 for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,r=radius+def[i],x=r*Math.cos(a),y=r*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
 ctx.closePath();
 const bright=Math.min(1,.24+energy*.76);
 ctx.shadowBlur=(18+energy*24)*scale;ctx.shadowColor=`rgba(255,255,255,${bright})`;ctx.fillStyle=`rgba(255,255,255,${bright})`;ctx.fill();ctx.shadowBlur=0;
 ctx.beginPath();
 for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,r=radius*.76+def[i]*.45,x=r*Math.cos(a),y=r*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
 ctx.closePath();ctx.fillStyle="rgba(5,5,5,.9)";ctx.fill();
 const hexVolume=Math.max(0,Math.min(1,energy));
 const edgeWidth=(1.2+hexVolume*136)*scale;
 ctx.strokeStyle=`rgba(255,255,255,${.2+hexVolume*.55})`;ctx.lineWidth=edgeWidth;ctx.stroke();
 const core=(3+energy*7+audio.high/255*2)*scale;
 ctx.beginPath();ctx.arc(0,0,core,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${.35+energy*.65})`;ctx.shadowBlur=10*scale;ctx.shadowColor="rgba(255,255,255,.8)";ctx.fill();
 ctx.restore();
}

function drawOuterHex(radius,rot,audio){
 const outerScale=1.52+Math.pow(Math.min(1,energy),2)*.48;
 const outerRadius=radius*outerScale;
 const outerDef=(audio.low/255)**2*8*scale;
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.beginPath();
 for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,r=outerRadius+outerDef,x=r*Math.cos(a),y=r*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
 ctx.closePath();ctx.strokeStyle=`rgba(255,255,255,${.16+energy*.30})`;ctx.lineWidth=(1.1+energy*3.2)*scale;ctx.shadowBlur=(7+energy*12)*scale;ctx.shadowColor="rgba(255,255,255,.65)";ctx.stroke();ctx.restore();
}

function drawParticles(audio){
 for(const p of particles){
  if(!audioElement.paused&&!audioElement.ended)p.a+=p.s*16;
  const r=p.r+energy*42*scale+audio.high/255*16*scale,x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r;
  ctx.beginPath();ctx.arc(x,y,p.size+(audio.high/255)*.6,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${Math.min(.5,p.alpha*(.3+energy*2.1))})`;ctx.fill();
 }
}
// Draw the original visualizer as a circular timer during the morph.
function drawTimerFace(radius){
 const remaining=timerState==="running"?timerRemainingMs:TIMER_DURATION_MS;
 const displayMs=timerState==="done"?0:remaining;
 const progress=Math.max(0,Math.min(1,displayMs/TIMER_DURATION_MS));
 ctx.save();
 ctx.translate(cx,cy);
 ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);
 ctx.fillStyle="rgba(5,5,5,.90)";
 ctx.fill();
 ctx.strokeStyle="rgba(255,255,255,.20)";
 ctx.lineWidth=2.5*scale;ctx.stroke();
 // Twelve understated marks retain a connection with the rotating geometry.
 for(let i=0;i<12;i++){
  const a=i*Math.PI/6-Math.PI/2;
  ctx.beginPath();
  ctx.moveTo(Math.cos(a)*radius*.84,Math.sin(a)*radius*.84);
  ctx.lineTo(Math.cos(a)*radius*.91,Math.sin(a)*radius*.91);
  ctx.strokeStyle="rgba(255,255,255,.42)";
  ctx.lineWidth=1.5*scale;
  ctx.stroke();
 }
 ctx.beginPath();
 ctx.arc(0,0,radius*.75,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);
 ctx.strokeStyle="rgba(255,255,255,.92)";
 ctx.lineWidth=4*scale;ctx.lineCap="round";
 ctx.shadowBlur=12*scale;ctx.shadowColor="rgba(255,255,255,.40)";
 ctx.stroke();ctx.shadowBlur=0;
 ctx.fillStyle="#fff";
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.font="600 "+Math.max(16,Math.round(radius*.43))+"px system-ui, sans-serif";
 ctx.fillText(formatTimer(displayMs),0,-radius*.04);
 ctx.font="500 "+Math.max(8,Math.round(radius*.105))+"px system-ui, sans-serif";
 ctx.fillStyle="rgba(255,255,255,.70)";
 ctx.fillText(timerState==="done"?"時間到":timerState==="running"?"倒數中":"等待音訊結束",0,radius*.40);
 ctx.restore();
}
function draw(){
 requestAnimationFrame(draw);
 const now=performance.now();lastTime=now;
 updateScene(now);
 updateTimer(now);
 const a=analyze(),target=Math.min(1,a.avg/68);
 energy+=(target-energy)*.15;bassEnergy+=(a.low-bassEnergy)*.20;midEnergy+=(a.mid-midEnergy)*.16;highEnergy+=(a.high-highEnergy)*.25;
 const beat=Math.max(0,target-energy);pulse+=(beat*58+energy*20+(bassEnergy/255)**2*10-pulse)*.22;
 updateHexRotation(now);
 drawBackground();
 const hexR=Math.min(w,h)*.105+energy*10*scale;
 const waveBase=hexR+Math.min(w,h)*.095+pulse*scale;
 const ringR=waveBase+Math.min(w,h)*.075;
 const idleX=w*(idleXPercent/100),idleY=h*(idleYPercent/100),idleScale=idleSizePercent/100;
 const originalX=idleX+(cx-idleX)*sceneProgress;
 const originalY=idleY+(cy-idleY)*sceneProgress;
 const originalScale=idleScale+(1-idleScale)*sceneProgress;
 // Return toward the pre-play position while shrinking to about half size.
 const timerScale=originalScale*(1-.52*timerMorph);
 const visualX=originalX+(idleX-originalX)*timerMorph;
 const visualY=originalY+(idleY-originalY)*timerMorph;
 const timerRadius=Math.min(w,h)*.19;
 const safePad=timerRadius*timerScale+5;
 const timerX=timerMorph>0?Math.max(safePad,Math.min(w-safePad,visualX)):visualX;
 const timerY=timerMorph>0?Math.max(safePad,Math.min(h-safePad,visualY)):visualY;
 ctx.save();
 ctx.translate(timerX,timerY);
 ctx.scale(timerScale,timerScale);
 ctx.translate(-cx,-cy);
 ctx.globalAlpha=1-timerMorph;
 if(timerMorph<1){
 drawParticles(a);
 drawSymmetricRing(ringR,1+energy*1.8,.08+energy*.15,energy*9*scale);
 drawSymmetricRing(ringR+8*scale,1,.025+energy*.065,energy*5*scale);
 drawBassArcs(ringR+3*scale,a,now*.00065);
 drawCoilGlow(waveBase,now*.00045);
 drawOuterHex(hexR,rotation,a);
 drawHex(hexR,rotation,a);
 }
 if(timerMorph>0){
  ctx.globalAlpha=timerMorph;
  drawTimerFace(timerRadius);
 }
 ctx.restore();
}
requestAnimationFrame(draw);
</script>
