<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Human Verification Test #67 - Stage Opening</title>
<link rel="preload" href="assets/backgrounds/Start_dark.PNG" as="image">
<link rel="preload" href="assets/backgrounds/IMG_0165.png" as="image">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff}
body{cursor:none}
#visualizerWrap{position:relative;width:100%;height:100%;overflow:hidden;background:#050505}
#visualizerWrap:fullscreen{width:100vw;height:100vh;background:#050505}
#visualizer{position:absolute;inset:0;width:100%;height:100%;display:block}
audio,video{display:none}
</style>
</head>
<body>
<main id="visualizerWrap">
<canvas id="visualizer" aria-label="Stage projection: click or press Space to reveal the room; advance again for the AI opening"></canvas>
<video id="roomRevealVideo" preload="auto" muted playsinline disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
<audio id="openingAudio" preload="auto" aria-hidden="true" tabindex="-1"></audio>
</main>
<script src="opening-config.js"></script>
<script src="opening-controller.js"></script>
<script src="visualizer.js"></script>
</body>
</html>
